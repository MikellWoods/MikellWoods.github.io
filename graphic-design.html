<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
font-family: Arial;
}

.header {
text-align: center;
padding: 32px;
}

.graphic-design-row {
display: -ms-flexbox; /* IE10 */
display: flex;
-ms-flex-wrap: wrap; /* IE10 */
flex-wrap: wrap;
padding: 0 4px;
}

/* Create four equal columns that sits next to each other */
.graphic-design-column {
-ms-flex: 25%; /* IE10 */
flex: 25%;
max-width: 25%;
padding: 0 4px;
}

.graphic-design-column img {
margin-top: 8px;
vertical-align: middle;
width: 100%;
-webkit-user-drag: none;
user-select: none; 
cursor: pointer; /* Makes it obvious images are clickable */
transition: opacity 0.2s ease, transform 0.2s ease;
}

/* Micro-interaction layout look */
.graphic-design-column img:hover {
opacity: 0.85;
transform: scale(1.01);
}

/* Responsive layout - makes a two column-layout instead of four columns */
@media screen and (max-width: 800px) {
.graphic-design-column {
-ms-flex: 50%;
flex: 50%;
max-width: 50%;
}
}

/* Responsive layout - makes the two columns stack on top of each other instead of next to each other */
@media screen and (max-width: 600px) {
.graphic-design-column {
-ms-flex: 100%;
flex: 100%;
max-width: 100%;
}
}
</style>

<script>
/* MENU OPEN & CLOSE */
function openMenu() {
document.getElementById("graphic-design-menu").style.width = "100%";
}

function closeMenu() {
document.getElementById("graphic-design-menu").style.width = "0%";
}

/* PAGE PROTECTER */
document.addEventListener('contextmenu', function(event) {
if (event.target.tagName) {
event.preventDefault();
}
});

/* MODAL GALLERY CONTROLLER ENGINE */
document.addEventListener("DOMContentLoaded", function() {
const triggers = document.querySelectorAll('.modal-trigger');
const modal = document.getElementById('image-gallery-modal');
const modalImg = document.getElementById('modal-target-image');
const modalCaption = document.getElementById('modal-target-caption');
const blurContainer = document.getElementById('blur-container');
const closeBtn = document.querySelector('.custom-modal-close');

// Cycle through image elements to assign click behaviors
triggers.forEach(img => {
img.addEventListener('click', function() {
modal.classList.add('is-visible');
blurContainer.classList.add('page-blur-active');
modalImg.src = this.src;
modalCaption.innerText = this.getAttribute('data-caption') || "Artwork File";
});
});

// Close Modal Logic Function
function hideModal() {
modal.classList.remove('is-visible');
blurContainer.classList.remove('page-blur-active');
}

// Dismiss trigger bindings
closeBtn.addEventListener('click', hideModal);
modal.addEventListener('click', function(e) {
if (e.target === modal) {
hideModal();
}
});
});
</script>
