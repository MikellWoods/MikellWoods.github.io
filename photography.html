<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial;
}

.header {
  text-align: center;
  padding: 32px;
}

.row {
  display: -ms-flexbox; /* IE10 */
  display: flex;
  -ms-flex-wrap: wrap; /* IE10 */
  flex-wrap: wrap;
  padding: 0 4px;
  
}

/* Create four equal columns that sits next to each other */
.column {
  -ms-flex: 25%; /* IE10 */
  flex: 25%;
  max-width: 25%;
  padding: 0 4px;
}

.column img {
  margin-top: 8px;
  vertical-align: middle;
  width: 100%;
  -webkit-user-drag: none;
  user-select: none; 
}

/* Responsive layout - makes a two column-layout instead of four columns */
@media screen and (max-width: 800px) {
  .column {
    -ms-flex: 50%;
    flex: 50%;
    max-width: 50%;
  }
}

/* Responsive layout - makes the two columns stack on top of each other instead of next to each other */
@media screen and (max-width: 600px) {
  .column {
    -ms-flex: 100%;
    flex: 100%;
    max-width: 100%;
  }
}
</style>











<style>
/* G E N E R A L */
@font-face {

html, body {

/* INDEX TEXT */
.photography-top {
  background: rgba(255, 255, 255, 0.1); 
  backdrop-filter: blur(8px);
  color: white;
  padding: 3vh;
  text-align: center;
}

.photography-main {
  padding: 2vw;
  color: white;
}

.photography-main-text {
  font-size: 4vh;
  text-align: center;
}

#photography-glass {
  background: rgba(255, 255, 255, 0.1); 
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.3); 
  border-radius: 2vh;
  box-shadow: 0 8px 24px rgba(255, 255, 255, 0.2);
  padding: 3vw;
  margin: 5vw;
  z-index: 0;
}



/* INDEX MENU */
.photography-overlay {
  height: 100%;
  width: 0;
  top: 0;
  left: 0;
  position: fixed;
  background: rgba(0, 0, 0, 0.75); 
  backdrop-filter: blur(5px);  
  overflow-x: hidden;
  transition: 2.5s;
  z-index: 2;

}

.photography-overlay-content {
  position: relative;
  top: 25%;
  width: 100%;
  text-align: center;
  margin-top: 25px;
}

#photography-menu-button {
  font-size: 5vh;
  cursor: pointer;
  color: white;
  margin-left: 15px;
}

#photography-menu-bar {
  position: sticky;
  top: 0;
  overflow: hidden;
  background: rgba(75, 75, 75, 0.50); 
  backdrop-filter: blur(3px);  
  z-index: 1;
}

#photography-menu-bar a {
  float: left;
  display: block;
  color: #f2f2f2;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
  font-size: 17px;
}

#photography-menu-bar a:hover {
  background-color: #ddd;
  color: black;
}

#photography-menu-bar a.active {
  background-color: #04AA6D;
  color: white;
}

.photography-overlay a {
  padding: 8px;
  text-decoration: none;
  font-size: 36px;
  color: #818181;
  display: block;
  transition: 0.3s;
}

.photography-overlay a:hover, .photography-overlay a:focus {
  color: #f1f1f1;
}

.photography-overlay .photography-close-menu {
  position: absolute;
  top: 20px;
  right: 45px;
  font-size: 60px;
}

@media screen and (max-height: 450px) {
  .photography-overlay a {font-size: 20px}
  .photography-overlay .photography-close-menu {
  font-size: 40px;
  top: 15px;
  right: 35px;
  }
}



/* PAGE FLICKER */
@keyframes flicker {
  0% {
    opacity: 0.27861;
  }
  5% {
    opacity: 0.34769;
  }
  10% {
    opacity: 0.23604;
  }
  15% {
    opacity: 0.90626;
  }
  20% {
    opacity: 0.18128;
  }
  25% {
    opacity: 0.83891;
  }
  30% {
    opacity: 0.65583;
  }
  35% {
    opacity: 0.67807;
  }
  40% {
    opacity: 0.26559;
  }
  45% {
    opacity: 0.84693;
  }
  50% {
    opacity: 0.96019;
  }
  55% {
    opacity: 0.08594;
  }
  60% {
    opacity: 0.20313;
  }
  65% {
    opacity: 0.71988;
  }
  70% {
    opacity: 0.53455;
  }
  75% {
    opacity: 0.37288;
  }
  80% {
    opacity: 0.71428;
  }
  85% {
    opacity: 0.70419;
  }
  90% {
    opacity: 0.7003;
  }
  95% {
    opacity: 0.36108;
  }
  100% {
    opacity: 0.24387;
  }
}

.crt::after {
  content: " ";
  display: block;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  right: 0;
  background: rgba(18, 16, 16, 0.1);
  opacity: 0;
  z-index: 2;
  pointer-events: none;
  animation: flicker 0.15s infinite;
}

.crt::before {
  content: " ";
  display: block;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  right: 0;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
  z-index: 2;
  background-size: 100% 2px, 3px 100%;
  pointer-events: none;
}

.crt {
  animation: textShadow 1.6s infinite;
}



/* LINK TEXT GLITCH EFFECT */
.glitch-text a {
  position: relative;
  color: rgb(255, 255, 255);;
  font-size: 2.5rem;
  text-align: center;
  text-decoration: none;
  animation: glitch 1s infinite;
}
@keyframes glitch {
  0%   { text-shadow: 2px 2px #ffffff, -2px -2px rgb(255, 255, 255); }
  25%  { text-shadow: -2px 2px rgb(255, 255, 255), 2px -2px rgb(255, 255, 255); }
  50%  { text-shadow: 2px -2px rgb(255, 255, 255), -2px 2px rgb(255, 255, 255); }
  75%  { text-shadow: -2px -2px rgb(255, 255, 255), 2px 2px rgb(255, 255, 255); }
  100% { text-shadow: 2px 2px rgb(255, 255, 255), -2px -2px rgb(255, 255, 255); }
}

a {
    color: rgb(255, 255, 255);;
    text-decoration: none;
}


a:hover {
    animation: glitch 1s infinite;
    color: #000000;
}

a[href="/"] {
  display: inline-block;
  margin-top: 1rem;
  color: rgb(255, 255, 255);;
  font-style: italic;
  text-decoration: underline;
  opacity: 0.8;
}

a[href="/"]:hover {
  opacity: 1;
}



/* SCROLLBAR (desktop) */
body::-webkit-scrollbar {

body::-webkit-scrollbar-track {

}

<script>
/* MENU OPEN & CLOSE */
function openMenu() {
document.getElementById("photography-menu").style.width = "100%";
}

function closeMenu() {
document.getElementById("photography-menu").style.width = "0%";
}




/* PAGE PROTECTER */
document.addEventListener('contextmenu', function(event) {
    if (event.target.tagName) {
      event.preventDefault();
    }
  });
</script>
